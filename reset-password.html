<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>টিন হাউস — নতুন পাসওয়ার্ড সেট করুন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
 :root {
 --ink: #161B1F;
 --steel-900: #1E262C;
 --steel-700: #3A464E;
 --steel-500: #6B7A82;
 --steel-300: #AEB9BD;
 --paper: #F1EFE9;
 --rust: #BE4A22;
 --rust-dark: #9A3A19;
 --danger: #B23B2E;
 --success: #3C7A54;
 --radius: 10px;
 }
 * { box-sizing: border-box; }
 body {
 margin: 0;
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 background: var(--steel-900);
 background-image: radial-gradient(circle at 20% 20%, var(--steel-700), var(--steel-900) 60%);
 font-family: 'Hind Siliguri', sans-serif;
 color: var(--ink);
 }
 .card {
 width: 100%;
 max-width: 380px;
 margin: 20px;
 background: var(--paper);
 border-radius: var(--radius);
 padding: 34px 30px;
 box-shadow: 0 20px 50px rgba(0,0,0,0.4);
 }
 .brand-icon { font-size: 38px; text-align: center; display: block; margin-bottom: 6px; }
 .brand {
 font-family: 'Baloo Da 2', sans-serif;
 font-weight: 700;
 font-size: 24px;
 color: var(--steel-900);
 text-align: center;
 margin: 0 0 4px;
 }
 .tagline { text-align: center; color: var(--steel-500); font-size: 13.5px; margin: 0 0 26px; }
 label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; color: var(--steel-900); }
 input {
 width: 100%;
 padding: 11px 13px;
 border-radius: 8px;
 border: 1px solid var(--steel-300);
 background: #fff;
 font-family: inherit;
 font-size: 15px;
 }
 input:focus {
 outline: none;
 border-color: var(--rust);
 box-shadow: 0 0 0 3px rgba(190,74,34,0.15);
 }
 button.submit {
 width: 100%;
 margin-top: 22px;
 padding: 12px;
 border: none;
 border-radius: 8px;
 background: var(--rust);
 color: #fff;
 font-family: 'Baloo Da 2', sans-serif;
 font-weight: 600;
 font-size: 16px;
 cursor: pointer;
 transition: background 0.15s;
 }
 button.submit:hover { background: var(--rust-dark); }
 button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
 .msgbox {
 margin-top: 14px;
 border-radius: 8px;
 padding: 10px 12px;
 font-size: 13.5px;
 display: none;
 background: #fbe4de;
 color: var(--danger);
 border: 1px solid #f0bdae;
 }
 .msgbox.show { display: block; }
 .msgbox.success { background: #e4f1e8; color: var(--success); border-color: #bcdcc7; }
 .hidden { display: none; }
 .status-text { text-align: center; color: var(--steel-500); font-size: 13.5px; }
 .spinner {
 width: 26px; height: 26px; margin: 0 auto 14px;
 border: 3px solid var(--steel-300); border-top-color: var(--rust);
 border-radius: 50%;
 animation: spin 0.8s linear infinite;
 }
 @keyframes spin { to { transform: rotate(360deg); } }
 a.login-link { display:block; text-align:center; margin-top:18px; font-size:13.5px; color: var(--rust); font-weight:600; text-decoration:none; }
 a.login-link:hover { color: var(--rust-dark); }
</style>
</head>
<body>
 <div class="card">
 <span class="brand-icon">🔩</span>
 <p class="brand">টিন হাউস</p>
 <p class="tagline">দোকান ম্যানেজমেন্ট সিস্টেম</p>
 
 <!-- লিংক যাচাই হওয়ার সময় -->
 <div id="checkingBox">
 <div class="spinner"></div>
 <p class="status-text">লিংক যাচাই করা হচ্ছে...</p>
 </div>
 
 <!-- লিংক অকার্যকর হলে -->
 <div id="invalidBox" class="hidden">
 <div class="msgbox show">এই রিসেট লিংকটি অকার্যকর অথবা মেয়াদ শেষ হয়ে গেছে। লগইন পেজে গিয়ে আবার "পাসওয়ার্ড ভুলে গেছেন?" থেকে নতুন লিংক চান।</div>
 <a class="login-link" href="login.html">← লগইন পেজে ফিরে যান</a>
 </div>
 
 <!-- নতুন পাসওয়ার্ড ফর্ম -->
 <form id="resetForm" class="hidden">
 <label for="newPassword">নতুন পাসওয়ার্ড</label>
 <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" placeholder="কমপক্ষে ৬ ক্যারেক্টার">
 <label for="confirmPassword">পাসওয়ার্ড আবার লিখুন</label>
 <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
 <div class="msgbox" id="resetErrorBox"></div>
 <button type="submit" class="submit" id="resetBtn">নতুন পাসওয়ার্ড সেট করুন</button>
 </form>
 
 <!-- সফল হলে -->
 <div id="doneBox" class="hidden">
 <div class="msgbox show success">পাসওয়ার্ড বদলানো হয়েছে! এখন নতুন পাসওয়ার্ড দিয়ে লগইন করতে পারবেন।</div>
 <a class="login-link" href="login.html">লগইন পেজে যান →</a>
 </div>
 </div>
 
 <script src="config.js"></script>
 <script>
 const checkingBox = document.getElementById('checkingBox');
 const invalidBox = document.getElementById('invalidBox');
 const resetForm = document.getElementById('resetForm');
 const doneBox = document.getElementById('doneBox');
 const resetErrorBox = document.getElementById('resetErrorBox');
 const resetBtn = document.getElementById('resetBtn');
 
 function show(el){ el.classList.remove('hidden'); }
 function hide(el){ el.classList.add('hidden'); }
 
 let recoveryReady = false;
 
 // ইমেইলের লিংকে ক্লিক করলে Supabase নিজে থেকেই URL থেকে টোকেন পড়ে সেশন বসিয়ে দেয়,
 // আর PASSWORD_RECOVERY ইভেন্ট পাঠায় — সেটা ধরে ফর্ম দেখাই
 supabaseClient.auth.onAuthStateChange((event, session) => {
 if (event === 'PASSWORD_RECOVERY' && session) {
 recoveryReady = true;
 hide(checkingBox);
 hide(invalidBox);
 show(resetForm);
 }
 });
 
 // কিছু ক্ষেত্রে ইভেন্টটা মিস হয়ে যেতে পারে, তাই সেশন থাকলেও ফর্ম দেখাই (fallback)
 (async () => {
 await new Promise((res) => setTimeout(res, 1200));
 if (recoveryReady) return;
 const { data } = await supabaseClient.auth.getSession();
 if (data.session) {
 recoveryReady = true;
 hide(checkingBox);
 show(resetForm);
 } else {
 hide(checkingBox);
 show(invalidBox);
 }
 })();
 
 resetForm.addEventListener('submit', async (e) => {
 e.preventDefault();
 resetErrorBox.classList.remove('show');
 const p1 = document.getElementById('newPassword').value;
 const p2 = document.getElementById('confirmPassword').value;
 if (p1.length < 6) {
 resetErrorBox.textContent = 'পাসওয়ার্ড কমপক্ষে ৬ ক্যারেক্টার হতে হবে';
 resetErrorBox.classList.add('show');
 return;
 }
 if (p1 !== p2) {
 resetErrorBox.textContent = 'দুটো পাসওয়ার্ড মিলছে না, আবার লিখুন';
 resetErrorBox.classList.add('show');
 return;
 }
 resetBtn.disabled = true;
 resetBtn.textContent = 'সেভ হচ্ছে...';
 try {
 const { error } = await supabaseClient.auth.updateUser({ password: p1 });
 if (error) throw error;
 hide(resetForm);
 show(doneBox);
 await supabaseClient.auth.signOut();
 } catch (err) {
 resetErrorBox.textContent = 'পাসওয়ার্ড সেভ করা যায়নি — আবার চেষ্টা করুন।';
 resetErrorBox.classList.add('show');
 resetBtn.disabled = false;
 resetBtn.textContent = 'নতুন পাসওয়ার্ড সেট করুন';
 }
 });
 </script>
</body>
</html>
