<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>টিন হাউস — লগইন</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
 :root {
 --ink: #161B1F;
 --steel-900: #1E262C;
 --steel-700: #3A464E;
 --steel-500: #6B7A82;
 --steel-300: #AEB9BD;
 --steel-100: #E9ECED;
 --paper: #F1EFE9;
 --rust: #BE4A22;
 --rust-dark: #9A3A19;
 --danger: #B23B2E;
 --success: #3C7A54;
 --radius: 10px;
 }
 * { box-sizing: border-box; }
 body {
 margin: 0;
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 background: var(--steel-900);
 background-image: radial-gradient(circle at 20% 20%, var(--steel-700), var(--steel-900) 60%);
 font-family: 'Hind Siliguri', sans-serif;
 color: var(--ink);
 }
 .card {
 width: 100%;
 max-width: 380px;
 margin: 20px;
 background: var(--paper);
 border-radius: var(--radius);
 padding: 34px 30px;
 box-shadow: 0 20px 50px rgba(0,0,0,0.4);
 }
 .brand-icon { font-size: 38px; text-align: center; display: block; margin-bottom: 6px; }
 .brand {
 font-family: 'Baloo Da 2', sans-serif;
 font-weight: 700;
 font-size: 24px;
 color: var(--steel-900);
 text-align: center;
 margin: 0 0 4px;
 }
 .tagline { text-align: center; color: var(--steel-500); font-size: 13.5px; margin: 0 0 26px; }
 label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; color: var(--steel-900); }
 input {
 width: 100%;
 padding: 11px 13px;
 border-radius: 8px;
 border: 1px solid var(--steel-300);
 background: #fff;
 font-family: inherit;
 font-size: 15px;
 }
 input:focus {
 outline: none;
 border-color: var(--rust);
 box-shadow: 0 0 0 3px rgba(190,74,34,0.15);
 }
 button.submit {
 width: 100%;
 margin-top: 22px;
 padding: 12px;
 border: none;
 border-radius: 8px;
 background: var(--rust);
 color: #fff;
 font-family: 'Baloo Da 2', sans-serif;
 font-weight: 600;
 font-size: 16px;
 cursor: pointer;
 transition: background 0.15s;
 }
 button.submit:hover { background: var(--rust-dark); }
 button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
 .msgbox {
 margin-top: 14px;
 border-radius: 8px;
 padding: 10px 12px;
 font-size: 13.5px;
 display: none;
 background: #fbe4de;
 color: var(--danger);
 border: 1px solid #f0bdae;
 }
 .msgbox.show { display: block; }
 .msgbox.success {
 background: #e4f1e8;
 color: var(--success);
 border-color: #bcdcc7;
 }
 .forgot-link {
 display: block;
 text-align: center;
 margin-top: 16px;
 font-size: 13px;
 color: var(--steel-500);
 text-decoration: underline;
 cursor: pointer;
 background: none;
 border: none;
 font-family: inherit;
 width: 100%;
 }
 .forgot-link:hover { color: var(--rust); }
 .back-link {
 display: block;
 text-align: center;
 margin-top: 18px;
 font-size: 13.5px;
 color: var(--rust);
 font-weight: 600;
 text-decoration: none;
 cursor: pointer;
 background: none;
 border: none;
 font-family: inherit;
 width: 100%;
 }
 .back-link:hover { color: var(--rust-dark); }
 .hidden { display: none; }
 .helper-text { text-align:center; color: var(--steel-500); font-size: 13px; line-height: 1.6; margin: 0 0 18px; }
</style>
</head>
<body>
 <div class="card">
 <span class="brand-icon">🔩</span>
 <p class="brand">টিন হাউস</p>
 <p class="tagline">দোকান ম্যানেজমেন্ট সিস্টেম</p>
 
 <!-- লগইন ফর্ম -->
 <form id="loginForm">
 <label for="loginEmail">ইমেইল</label>
 <input type="email" id="loginEmail" required autocomplete="username">
 <label for="loginPassword">পাসওয়ার্ড</label>
 <input type="password" id="loginPassword" required autocomplete="current-password">
 <div class="msgbox" id="errorBox"></div>
 <button type="submit" class="submit" id="loginBtn">লগইন করুন</button>
 <button type="button" class="forgot-link" id="showForgotBtn">পাসওয়ার্ড ভুলে গেছেন?</button>
 </form>
 
 <!-- পাসওয়ার্ড ভুলে গেলে (রিসেট লিংক পাঠানোর ফর্ম) -->
 <form id="forgotForm" class="hidden">
 <p class="helper-text">আপনার লগইন ইমেইলটি লিখুন — আমরা সেখানে একটি পাসওয়ার্ড রিসেট লিংক পাঠাবো। লিংকে চাপ দিয়ে নতুন পাসওয়ার্ড সেট করতে পারবেন।</p>
 <label for="forgotEmail">ইমেইল</label>
 <input type="email" id="forgotEmail" required autocomplete="username">
 <div class="msgbox" id="forgotErrorBox"></div>
 <div class="msgbox" id="forgotSuccessBox"></div>
 <button type="submit" class="submit" id="forgotBtn">রিসেট লিংক পাঠান</button>
 <button type="button" class="back-link" id="backToLoginBtn">← লগইনে ফিরে যান</button>
 </form>
 </div>
 
 <script src="config.js"></script>
 <script>
 if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
 navigator.serviceWorker.register('sw.js').catch((err) => console.warn('Service worker রেজিস্টার হয়নি:', err));
 });
 }
 
 const errorBox = document.getElementById('errorBox');
 function showError(msg){ errorBox.textContent = msg; errorBox.classList.remove('success'); errorBox.classList.add('show'); }
 function hideError(){ errorBox.classList.remove('show'); }
 
 // ইতিমধ্যে লগইন করা থাকলে সরাসরি অ্যাপে পাঠিয়ে দাও
 (async () => {
 const { data } = await supabaseClient.auth.getSession();
 if (data.session) window.location.href = 'index.html';
 })();
 
 const loginForm = document.getElementById('loginForm');
 const loginBtn = document.getElementById('loginBtn');
 loginForm.addEventListener('submit', async (e) => {
 e.preventDefault();
 hideError();
 loginBtn.disabled = true;
 loginBtn.textContent = 'লগইন হচ্ছে...';
 const email = document.getElementById('loginEmail').value.trim();
 const password = document.getElementById('loginPassword').value;
 try {
 const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
 if (error) throw error;
 window.location.href = 'index.html';
 } catch (err) {
 showError('ইমেইল অথবা পাসওয়ার্ড ভুল হয়েছে। আবার চেষ্টা করো।');
 loginBtn.disabled = false;
 loginBtn.textContent = 'লগইন করুন';
 }
 });
 
 /* ============================================================
 পাসওয়ার্ড ভুলে গেলে — রিসেট লিংক পাঠানো
 ============================================================ */
 const showForgotBtn = document.getElementById('showForgotBtn');
 const backToLoginBtn = document.getElementById('backToLoginBtn');
 const forgotForm = document.getElementById('forgotForm');
 const forgotErrorBox = document.getElementById('forgotErrorBox');
 const forgotSuccessBox = document.getElementById('forgotSuccessBox');
 const forgotBtn = document.getElementById('forgotBtn');
 
 function hideForgotMsgs(){
 forgotErrorBox.classList.remove('show');
 forgotSuccessBox.classList.remove('show');
 }
 
 showForgotBtn.addEventListener('click', () => {
 loginForm.classList.add('hidden');
 forgotForm.classList.remove('hidden');
 hideError();
 hideForgotMsgs();
 });
 backToLoginBtn.addEventListener('click', () => {
 forgotForm.classList.add('hidden');
 loginForm.classList.remove('hidden');
 hideForgotMsgs();
 });
 
 forgotForm.addEventListener('submit', async (e) => {
 e.preventDefault();
 hideForgotMsgs();
 forgotBtn.disabled = true;
 forgotBtn.textContent = 'পাঠানো হচ্ছে...';
 const email = document.getElementById('forgotEmail').value.trim();
 try {
 // reset-password.html-এ পাঠাবে, যেখানে গিয়ে নতুন পাসওয়ার্ড সেট করা যাবে
 const redirectTo = window.location.origin + '/reset-password.html';
 const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo });
 if (error) throw error;
 forgotSuccessBox.textContent = 'রিসেট লিংক পাঠানো হয়েছে — আপনার ইমেইল চেক করুন (স্প্যাম/জাঙ্ক ফোল্ডারও দেখুন)।';
 forgotSuccessBox.classList.add('show', 'success');
 forgotBtn.textContent = 'আবার পাঠান';
 } catch (err) {
 forgotErrorBox.textContent = 'লিংক পাঠানো যায়নি — ইমেইলটি ঠিক আছে কিনা দেখুন, আবার চেষ্টা করুন।';
 forgotErrorBox.classList.add('show');
 forgotBtn.textContent = 'রিসেট লিংক পাঠান';
 } finally {
 forgotBtn.disabled = false;
 }
 });
 </script>
</body>
</html>
