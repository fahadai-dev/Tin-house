<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>নতুন দোকান তৈরি — শুধু অ্যাডমিনের জন্য</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
 :root {
 --ink: #161B1F;
 --steel-900: #1E262C;
 --steel-700: #3A464E;
 --steel-500: #6B7A82;
 --steel-300: #AEB9BD;
 --steel-100: #E9ECED;
 --paper: #F1EFE9;
 --rust: #BE4A22;
 --rust-dark: #9A3A19;
 --danger: #B23B2E;
 --success: #3C7A54;
 --radius: 10px;
 }
 * { box-sizing: border-box; }
 body {
 margin: 0;
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 background: var(--steel-900);
 background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 12px, transparent 12px 24px);
 font-family: 'Hind Siliguri', sans-serif;
 color: var(--ink);
 }
 .card {
 width: 100%;
 max-width: 420px;
 margin: 20px;
 background: var(--paper);
 border-radius: var(--radius);
 padding: 30px 28px;
 box-shadow: 0 20px 50px rgba(0,0,0,0.4);
 }
 .warn-tag {
 background: var(--steel-900); color: #fff; font-size: 11.5px; font-weight: 700;
 padding: 6px 10px; border-radius: 20px; display: inline-block; margin-bottom: 14px;
 }
 .brand {
 font-family: 'Baloo Da 2', sans-serif;
 font-weight: 700;
 font-size: 21px;
 color: var(--steel-900);
 margin: 0 0 4px;
 }
 .tagline { color: var(--steel-500); font-size: 13px; margin: 0 0 22px; }
 label { display: block; font-size: 13.5px; font-weight: 600; margin: 14px 0 6px; color: var(--steel-900); }
 input {
 width: 100%;
 padding: 11px 13px;
 border-radius: 8px;
 border: 1px solid var(--steel-300);
 background: #fff;
 font-family: inherit;
 font-size: 15px;
 }
 input:focus {
 outline: none;
 border-color: var(--rust);
 box-shadow: 0 0 0 3px rgba(190,74,34,0.15);
 }
 button.submit {
 width: 100%;
 margin-top: 22px;
 padding: 12px;
 border: none;
 border-radius: 8px;
 background: var(--rust);
 color: #fff;
 font-family: 'Baloo Da 2', sans-serif;
 font-weight: 600;
 font-size: 16px;
 cursor: pointer;
 }
 button.submit:hover { background: var(--rust-dark); }
 button.submit:disabled { opacity: 0.6; cursor: not-allowed; }
 .msgbox { margin-top: 14px; border-radius: 8px; padding: 10px 12px; font-size: 13.5px; display: none; }
 .msgbox.error { background: #fbe4de; color: var(--danger); border: 1px solid #f0bdae; }
 .msgbox.success { background: #e9f1ea; color: var(--success); border: 1px solid #bfdcc4; }
 .msgbox.show { display: block; }
 .divider { border-top: 1px dashed var(--steel-300); margin: 18px 0 4px; }
</style>
</head>
<body>
 <div class="card">
 <span class="warn-tag">🔒 শুধু অ্যাডমিন — এই লিংক কখনো ক্লায়েন্টকে দেবেন না</span>
 <p class="brand">নতুন দোকান তৈরি করুন</p>
 <p class="tagline">ক্লায়েন্টের দোকানের জন্য মালিক অ্যাকাউন্ট এখান থেকে বানিয়ে দিন</p>
 
 <form id="createForm">
 <label for="adminCode">অ্যাডমিন কোড (গোপন)</label>
 <input type="password" id="adminCode" required autocomplete="off" placeholder="আপনার গোপন কোড">
 
 <div class="divider"></div>
 
 <label for="shopName">দোকানের নাম</label>
 <input type="text" id="shopName" required placeholder="যেমনঃ টিন হাউস, সাভার">
 <label for="ownerName">মালিকের নাম</label>
 <input type="text" id="ownerName" required placeholder="যেমনঃ মোঃ করিম">
 <label for="ownerEmail">মালিকের ইমেইল</label>
 <input type="email" id="ownerEmail" required autocomplete="off">
 <label for="ownerPassword">মালিকের পাসওয়ার্ড</label>
 <input type="password" id="ownerPassword" required autocomplete="off" placeholder="কমপক্ষে ৬ ক্যারেক্টার">
 
 <div class="msgbox" id="msgBox"></div>
 <button type="submit" class="submit" id="createBtn">দোকান তৈরি করুন</button>
 </form>
 </div>
 
 <script src="config.js"></script>
 <script>
 const msgBox = document.getElementById('msgBox');
 function showMsg(msg, ok){
 msgBox.textContent = msg;
 msgBox.classList.remove('error','success');
 msgBox.classList.add(ok ? 'success' : 'error', 'show');
 }
 
 const form = document.getElementById('createForm');
 const btn = document.getElementById('createBtn');
 form.addEventListener('submit', async (e) => {
 e.preventDefault();
 msgBox.classList.remove('show');
 const admin_code = document.getElementById('adminCode').value;
 const shop_name = document.getElementById('shopName').value.trim();
 const full_name = document.getElementById('ownerName').value.trim();
 const email = document.getElementById('ownerEmail').value.trim();
 const password = document.getElementById('ownerPassword').value;
 
 if (password.length < 6) { showMsg('পাসওয়ার্ড কমপক্ষে ৬ ক্যারেক্টার হতে হবে', false); return; }
 
 btn.disabled = true;
 btn.textContent = 'তৈরি হচ্ছে...';
 try {
 const res = await fetch('/api/signup-owner', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ admin_code, shop_name, full_name, email, password })
 });
 const json = await res.json().catch(() => ({}));
 if (!res.ok) throw new Error(json.error || 'দোকান তৈরি করা যায়নি');
 
 showMsg(`✅ দোকান তৈরি হয়েছে! এখন ক্লায়েন্টকে "login.html" লিংক + এই ইমেইল (${email}) ও পাসওয়ার্ড দিয়ে দিন।`, true);
 form.reset();
 } catch (err) {
 showMsg(err.message || 'একটি সমস্যা হয়েছে, আবার চেষ্টা করো', false);
 } finally {
 btn.disabled = false;
 btn.textContent = 'দোকান তৈরি করুন';
 }
 });
 </script>
</body>
</html>
